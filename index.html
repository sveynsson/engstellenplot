  var bytes = function (b64) { return Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); }); };
  var $ = function (id) { return document.getElementById(id); };
  function zeige(text) { $('fehler').textContent = text; $('los').disabled = false; $('los').textContent = 'Öffnen'; }
  function oeffne(roh) {  // roh: 32 Byte Schlüssel
    return crypto.subtle.importKey('raw', roh, 'AES-GCM', false, ['decrypt'])
      .then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(V.iv) }, k, bytes(V.daten)); })
      .then(fertigGeladen)
      .then(function (klar) { var html = new TextDecoder().decode(klar); document.open(); document.write(html); document.close(); });
  }
  // Erst ersetzen, wenn die Anmeldeseite fertig geladen ist: Solange sie noch lädt, hängt document.write das Tool an die
  // Anmeldeseite an, statt sie zu ersetzen (Anmeldefeld und ihre Formate blieben dann über dem Tool stehen).
  function fertigGeladen(wert) {
    return new Promise(function (weiter) {
      if (document.readyState === 'complete') setTimeout(function () { weiter(wert); }, 0);
      else window.addEventListener('load', function () { setTimeout(function () { weiter(wert); }, 0); });
    });
  }
  function ausPasswort(pw) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits'])
      .then(function (k) { return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: bytes(V.salz), iterations: N, hash: 'SHA-256' }, k, 256); })
      .then(function (b) { return new Uint8Array(b); });
  }
  function lager(dauerhaft) { try { return dauerhaft ? localStorage : sessionStorage; } catch (e) { return null; } }
  if (!window.crypto || !crypto.subtle) { zeige('Dieser Browser kann die Seite nicht entschlüsseln (nur über https oder als lokale Datei).'); $('los').disabled = true; return; }
  // schon angemeldet? Gemerkt wird der abgeleitete Schlüssel, nicht das Passwort
  var gemerkt = null;
  [true, false].forEach(function (d) { var l = lager(d); try { gemerkt = gemerkt || (l && l.getItem(NAME + V.salz)); } catch (e) { /* kein Speicher */ } });
  if (gemerkt) oeffne(bytes(gemerkt)).catch(function () { [true, false].forEach(function (d) { var l = lager(d); try { if (l) l.removeItem(NAME + V.salz); } catch (e) { /* kein Speicher */ } }); });
  $('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    $('los').disabled = true; $('los').textContent = 'wird geprüft …'; $('fehler').textContent = '';
    var dauerhaft = $('merken').checked;
    ausPasswort($('pw').value).then(function (roh) {
      return oeffne(roh).then(function () {
        var l = lager(dauerhaft);
        try { if (l) l.setItem(NAME + V.salz, btoa(String.fromCharCode.apply(null, roh))); } catch (e) { /* kein Speicher */ }

    }).catch(function () { zeige('Das Passwort stimmt nicht.'); $('pw').select(); });
  });
